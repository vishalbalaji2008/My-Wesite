<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>
            Student Registration Form
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body{
                background-color:bisque;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }
            .registration-container{
                background-color: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                max-width: 900px;
                margin: 50px auto;
            }
            .form-title{
                text-align: center;
                margin-bottom: 20px;
                font-weight: bold;
            }

            .btn-register{
                background-color: #007bff;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 20px;
            }
            .btn-secondary{
                background-color: #6c757d;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 20px;
            }

        </style>

    </head>
    <body>
        <div class="container"><!---full box--->
            <div class="registration-container"><!---registration--->
                <h2 class="form-title">Student Registration Form</h2>
                <form>
                    <div class="row mb-3"><!--row1-->
                        <div class="col-md-6"><!--row1col1-->
                            <label for="firstname" class="form-label">First name:</label>
                            <input type="text" class="form-control" id="firstname" placeholder="Enter your first name" required>
                        </div>
                        <div class="col-md-6"><!--row1col2-->
                            <label for="lastname" class="form-label">Last name:</label>
                            <input type="text" class="form-control" id="lastname" placeholder="Enter your last name" required>
                        </div>
                        
                    </div>
                    <div class="row mb-3"><!--row2-->
                        <div class="col-md-6"><!--row2col1-->
                            <label for="Blood group" class="form-label">Blood group:</label>
                            <input type="text" class="form-control" id="bloodgroup" placeholder="Enter your bloodgroup" required>
                        </div>
                        <div class="col-md-6"><!--row2col2-->
                            <label for="dob" class="form-label">Date of Birth:</label>
                            <input type="date" class="form-control" id="dob" required>
                        </div>
                    </div>
                    <div class="row mb-3"><!--row3-->
                        <div class="col-md-6"><!--row3col1-->
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="col-md-6"><!--row3col2-->
                            <label for="phone" class="form-label">Phone:</label>
                            <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
                        </div>
                    </div><div class="row mb-3"><!--row4-->
                        <div class="col-md-6"><!--row4col1-->
                            <label for="gender" class="form-label">Gender:</label>
                            <select class="form-control" id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6"><!--row4col2-->
                            <label for="city" class="form-label">City:</label>
                            <input type="text" class="form-control" id="city" placeholder="Enter your city" required>
                        </div>
                    </div><div class="row mb-3"><!--row5-->
                        <div class="col-md-6"><!--row5col1-->
                            <label for="state" class="form-label">State:</label>
                            <input type="text" class="form-control" id="state" placeholder="Enter your state" required>
                        </div>
                        <div class="col-md-6"><!--row5col2-->
                            <label for="pin" class="form-label">Pin Code:</label>
                            <input type="text" class="form-control" id="pin" placeholder="Enter your pin code" required>
                        </div>
                    </div><div class="row mb-3"><!--row6-->
                        <div class="col-md-6"><!--row6col1-->
                            <label for="program" class="form-label">Program:</label>
                            <select class="form-control" id="program" required>
                                <option value="">Select Program</option>
                                <option value="btech">B.Tech</option>
                                <option value="be">B.E</option>
                                <option value="mtech">M.Tech</option>
                                <option value="mba">MBA</option>
                                <option value="msc">M.Sc</option>
                            </select>
                            </select>
                        </div>
                        <div class="col-md-6"><!--row6col2-->
                            <label for="course" class="form-label">Course:</label>
                            <select class="form-control" id="course" required>
                                <option value="">Select Course</option>
                                <option value="cse">CSE</option>
                                <option value="eee">EEE</option>
                                <option value="ece">ECE</option>
                                <option value="it">IT</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
                <button type="submit" class="btn btn-register">Register</button>
                <button type="reset" class="btn btn-secondary btn-reset">reset</button>
        </div>
    </body>
</html>
